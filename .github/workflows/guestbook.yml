name: guestbook
on:
  issues:
    types: [opened]
jobs:
  ingest:
    if: startsWith(github.event.issue.title, '[COMMENT]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Append comment
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: node scripts/ingest-comment.cjs
      - name: Commit
        run: |
          git config user.name "lethal-salt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comments.json
          git diff --staged --quiet || git commit -m "guestbook: ingest comment"
          git push
